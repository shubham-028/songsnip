# Installs (and later updates) the SongSnip background helper in your Cloudflare account.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy helper

on:
  workflow_dispatch:          # the "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ['helper/**']      # redeploy when the helper changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: helper
        run: npm ci
      - name: Deploy to Cloudflare
        working-directory: helper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          npx wrangler deploy
          echo "::notice::Helper installed. Its address is the https://songsnip-helper....workers.dev line above."
